spring.application.name=ermservice

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=ERM_FLYWAY_SCHEMA_HISTORY

springdoc.swagger-ui.defaultModelsExpandDepth=-1

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Render should set SPRING_PROFILES_ACTIVE to sit or production per service.
logging.level.com.org.erm.security=DEBUG
logging.level.com.org.erm.controller=DEBUG
logging.level.org.springframework.security=DEBUG
