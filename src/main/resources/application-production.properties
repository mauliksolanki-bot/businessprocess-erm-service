spring.config.activate.on-profile=production

spring.datasource.url=${PROD_DB_URL:${DB_URL:}}
spring.datasource.username=${PROD_DB_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${PROD_DB_PASSWORD:${DB_PASSWORD:}}

spring.flyway.url=${PROD_DB_URL:${DB_URL:}}
spring.flyway.user=${PROD_DB_USERNAME:${DB_USERNAME:}}
spring.flyway.password=${PROD_DB_PASSWORD:${DB_PASSWORD:}}

app.jwt.secret=${PROD_JWT_SECRET:${JWT_SECRET:change-this-to-a-long-random-secret-key-for-prod}}